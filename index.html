 $('#bb2').onclick=()=>{const p=get();if(!p)return;if(env!=0)return alert('Robôs rodam na conta Simulador. Troque para Simulador.');const n=$('#sn').value,b={id:Date.now(),n,sym,tf,p,st:'run',last:agg(M1[sym],TFS[tf]).length};
  if(n=='grid'){const an=px(),q=pip();b.lv=[];for(let j=1;j<=p.n;j++){if(p.dir!='sell')b.lv.push({pr:an-j*p.step*q,s:1});if(p.dir!='buy')b.lv.push({pr:an+j*p.step*q,s:-1})}}
  if(!b.lv){const z=S[n](agg(M1[sym],TFS[tf]).slice(-1500,-1),p).slice(-30).reverse().find(q=>q);if(z)open(z,sym,p.lot,p.sl,p.tp,'bot'+b.id)}bots.push(b);save();refL()};
 $('#csv').onchange=async e=>{const t=await e.target.files[0].text(),a=[];for(const l of t.split(/\r?\n/)){const c=l.split(/[,;\t]/);if(c.length<5)continue;let ts=isNaN(+c[0])?Date.parse(c[0])/1000:+c[0];if(isNaN(ts))continue;a.push({t:ts,o:+c[1],h:+c[2],l:+c[3],c:+c[4]})}
  if(a.length<200)return alert('CSV inválido ou com poucas velas (mín. 200).');M1[sym]=a;SRC[sym]='CSV importado';draw();nav(cur)}}
P.hist=()=>{const h=acc[env].hist;return`<div class=card><b>${ENVS[env]}</b><br>${stats(h)}</div><div class=card><table>${h.slice().reverse().map(t=>`<tr><td>${new Date(t.t).toLocaleString()}</td><td>${t.sym}</td><td>${t.s>0?'C':'V'}</td><td class="${t.pl>=0?'up':'dn'}">${fm(t.pl)}</td><td class=mu>${t.by}</td></tr>`).join('')||'<tr><td class=mu>Sem histórico.</td></tr>'}</table></div>`};
const BRK=[['Exness','MT5/MT4'],['XM','MT5/MT4'],['IC Markets','MT5/MT4/cTrader'],['Pepperstone','MT5/MT4/cTrader'],['RoboForex','MT5/MT4/cTrader'],['OANDA','API REST v20']];
P.brk=()=>`<div class=card><input id=q placeholder="Buscar corretora ou servidor" style="width:100%"><div id=bl></div></div>
 <div class=card><div class=row><select id=bk>${BRK.map(b=>`<option>${b[0]}</option>`)}</select><select id=bt><option>Demo</option><option>Real</option></select></div>
 <div class=row><input id=bs list=sl placeholder="Servidor (ex.: nome exibido no seu MT5)"><datalist id=sl>${srv.map(s=>`<option value="${s.name}">`).join('')}</datalist></div>
 <div class=row><input id=lg placeholder=Login><input id=pw type=password placeholder=Senha autocomplete=off></div>
 <div class=row><button id=ad>Salvar servidor</button><button class=p id=cn>Conectar</button></div><div id=cm class=mu></div></div>`;
const bindB=()=>{const r=()=>{const q=$('#q').value.toLowerCase();$('#bl').innerHTML='<table>'+BRK.filter(b=>b[0].toLowerCase().includes(q)).map(b=>`<tr><td>${b[0]}</td><td class=mu>${b[1]}</td></tr>`).join('')+srv.filter(s=>(s.b+s.name).toLowerCase().includes(q)).map(s=>`<tr><td>${s.b}</td><td>${s.name}</td><td class=mu>${s.type}</td></tr>`).join('')+'</table>'};$('#q').oninput=r;r();
 $('#ad').onclick=()=>{const n=$('#bs').value.trim();if(!n)return;srv.push({b:$('#bk').value,name:n,type:$('#bt').value});sv('fx_srv',srv);nav('brk')};
 $('#cn').onclick=()=>{$('#cm').textContent='Conexão não disponível: MT4/MT5 usam protocolo proprietário sem API pública para apps. É preciso um adaptador (MetaApi, cTrader Open API, OANDA v20 ou um backend próprio com a biblioteca MetaTrader5). Senha não foi armazenada nem enviada.'}};
const BIND={trade:bindS,strat:bindS,brk:bindB};
function nav(p){cur=p;$('#pn').innerHTML=P[p]();BIND[p]&&BIND[p]();mark();refL()}
/* ticks e motor de robôs */
let TPC=1;$('#spd').onchange=e=>TPC=+e.target.value;
function acctUp(){const a=acc[env],f=a.pos.reduce((t,x)=>t+pl(x,px(x.sym)),0);$('#acct').innerHTML=`<span>Saldo <b>${a.bal.toFixed(2)}</b></span><span>Equity <b>${(a.bal+f).toFixed(2)}</b></span><span>Flutuante <b class="${f>=0?'up':'dn'}">${fm(f)}</b></span><span>${a.pos.length} pos.</span>`}
function env0close(x,pr){const e=env;env=0;closePos(x.id,pr);env=e}
setInterval(()=>{cnt++;for(const s in M1){const a=M1[s],k=a.at(-1),sg=SYMS[s][0]*1.2e-3/Math.sqrt(TPC),p=k.c+(rnd()-.5)*sg;k.c=p;k.h=Math.max(k.h,p);k.l=Math.min(k.l,p);if(cnt%TPC==0)a.push({t:k.t+60,o:p,h:p,l:p,c:p})}
 const a=acc[0];a.pos.slice().forEach(x=>{const p=px(x.sym);if(x.sl&&(x.s>0?p<=x.sl:p>=x.sl))env0close(x,x.sl);else if(x.tp&&(x.s>0?p>=x.tp:p<=x.tp))env0close(x,x.tp)});
 bots.filter(b=>b.st=='run').forEach(b=>{if(b.lv){const p=px(b.sym);b.lv.forEach((l,i)=>{if(l.cl&&(l.s>0?p>l.pr:p<l.pr)){l.cl=false;l.o=false}if(!l.o&&(l.s>0?p<=l.pr:p>=l.pr)){l.o=true;open(l.s,b.sym,b.p.lot,b.p.sl,b.p.tp,'bot'+b.id,i)}})}
  else if(cnt%TPC==0){const d=agg(M1[b.sym],TFS[b.tf]);if(d.length==b.last)return;b.last=d.length;const z=S[b.n](d.slice(-1500,-1),b.p).at(-1);b.an=(b.an||0)+1;b.sg=z;if(z&&a.pos.filter(x=>x.by=='bot'+b.id).length<(b.p.max||1))open(z,b.sym,b.p.lot,b.p.sl,b.p.tp,'bot'+b.id)}});
 if(cnt%5==0)save();$('#px').textContent=fx(px());acctUp();draw();refL()},1000);

mark();nav('trade');draw();acctUp();$('#px').textContent=fx(px());
})();
</script></body></html>
